<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار تفاعلي: صور العناصر في الدوال | منصة بلبل التعليمية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            font-weight: 900;
        }
        body {
            background-color: #0b132b;
            color: #ffffff;
            line-height: 1.9;
            text-align: right;
            padding: 20px 10px;
        }
        .quiz-container {
            max-width: 850px;
            margin: auto;
            background: #1c2541;
            padding: 35px 20px;
            border-radius: 20px;
            border: 3px solid #e0a96d;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .header {
            text-align: center;
            border-bottom: 2px dashed #e0a96d;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        .profile-img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 3px solid #e0a96d;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            object-fit: cover;
            background-color: #0b132b;
        }
        .header h1 {
            color: #e0a96d;
            font-size: 2.2rem;
            margin-bottom: 8px;
        }
        .header p {
            color: #cbd5e1;
            font-size: 1.35rem;
        }
        .question-card {
            background: #0b132b;
            border: 2px solid #3a506b;
            border-right: 6px solid #e0a96d;
            padding: 24px;
            border-radius: 15px;
            margin-bottom: 25px;
        }
        .question-title {
            color: #e0a96d;
            font-size: 1.45rem;
            margin-bottom: 18px;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .option-btn {
            background: #1c2541;
            color: #ffffff;
            border: 2px solid #3a506b;
            padding: 14px 18px;
            border-radius: 12px;
            cursor: pointer;
            text-align: right;
            font-size: 1.3rem;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .option-btn:hover {
            border-color: #e0a96d;
            background: #3a506b;
        }
        .option-btn.selected {
            border-color: #e0a96d;
            background: rgba(224, 169, 109, 0.25);
        }
        .option-btn.correct-ans {
            background-color: #14532d !important;
            border-color: #22c55e !important;
            color: #dcfce7 !important;
        }
        .option-btn.wrong-ans {
            background-color: #7f1d1d !important;
            border-color: #ef4444 !important;
            color: #fee2e2 !important;
        }
        .submit-btn {
            background: #e0a96d;
            color: #0b132b;
            border: none;
            width: 100%;
            height: 60px;
            border-radius: 14px;
            font-size: 1.5rem;
            font-weight: 900;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.3s;
        }
        .submit-btn:hover {
            background: #c89355;
        }
        #result-box {
            display: none;
            text-align: center;
            padding: 30px 20px;
            background: #0b132b;
            border-radius: 18px;
            border: 3px solid #e0a96d;
            margin-bottom: 30px;
        }
        #result-box h2 {
            color: #e0a96d;
            font-size: 2.2rem;
            margin-bottom: 12px;
        }
        #result-box p {
            font-size: 1.6rem;
            color: #ffffff;
        }
        .restart-btn {
            background: #e0a96d;
            color: #0b132b;
            border: none;
            padding: 14px 30px;
            border-radius: 12px;
            font-size: 1.3rem;
            font-weight: 900;
            cursor: pointer;
            margin-top: 20px;
            display: inline-block;
        }
        .platform-footer {
            text-align: center;
            margin-top: 35px;
            padding-top: 20px;
            border-top: 2px dashed #3a506b;
            color: #e0a96d;
            font-size: 1.35rem;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="header">
        <img src="1768680691664.jpg" alt="الأستاذ نبيل" class="profile-img">
        <h1><i class="fas fa-square-root-variable"></i> اختبار تفاعلي: صور العناصر في الدوال</h1>
        <p>إعداد: نبيل | منصة بلبل التعليمية</p>
    </div>

    <div id="result-box">
        <h2><i class="fas fa-trophy"></i> نتيجة الاختبار التفاعلي</h2>
        <p id="score-text"></p>
        <button class="restart-btn" onclick="location.reload()"><i class="fas fa-redo"></i> إعادة الاختبار</button>
    </div>

    <form id="quizForm">
        <div id="questions-list"></div>
        <button type="button" class="submit-btn" id="sub-btn" onclick="calculateScore()"><i class="fas fa-check-circle"></i> إنهاء الاختبار وإظهار النتيجة</button>
    </form>

    <div class="platform-footer">
        منصة بلبل طريقك الموثوق للتفوق 🦅✨
    </div>
</div>

<script>
    const questions = [
        { q: "١. إذا كانت د(س) = ٥س - ٣، فإن صورة العنصر ٢ بالدالة د هي:", options: ["٧", "١٣", "٣", "-٧"], correct: 0 },
        { q: "٢. إذا كانت د(س) = ٧ (دالة ثابتة)، فإن قيمة د(-٥) تساوي:", options: ["-٥", "٧", "-٧", "صفر"], correct: 1 },
        { q: "٣. الدالة د(س) = س² - ٤س + ٣، فإن د(٣) تساوي:", options: ["٦", "-٣", "صفر", "١"], correct: 2 },
        { q: "٤. إذا كانت الدالة الجذرية د(س) = √(س + ٩)، فإن د(١٦) تساوي:", options: ["٥", "٢٥", "± ٥", "٤"], correct: 0 },
        { q: "٥. الدالة الكسرية د(س) = (س + ٥) / (س - ٢)، فإن صورة العنصر ٤ هي:", options: ["٩ / ٦", "٩ / ٢", "٩", "غير معرفة"], correct: 1 },
        { q: "٦. في الدالة د(س) = (٢س + ١) / (س - ٣)، تكون قيمة د(٣) هي:", options: ["٧", "صفر", "غير معرفة (غير موجودة)", "١"], correct: 2 },
        { q: "٧. إذا كانت دالة المقياس د(س) = |س - ٧|، فإن د(٢) تساوي:", options: ["-٥", "٥", "٩", "-٩"], correct: 1 },
        { q: "٨. إذا كانت د(س) = س³ - ٢، فإن د(-٢) تساوي:", options: ["-١٠", "-٦", "٦", "١٠"], correct: 0 },
        { q: "٩. إذا كانت د(س) = ٤ لكل س ∈ R، فإن د(١٠) + د(-١٠) تساوي:", options: ["صفر", "٤", "٨", "٢٠"], correct: 2 },
        { q: "١٠. الدالة د(س) = √(٢٥ - س²)، فإن صورة العنصر -٣ هي:", options: ["١٦", "٤", "-٤", "± ٤"], correct: 1 },
        { q: "١١. إذا كانت د(س) = (س² - ٩) / (س + ٣)، فإن د(٣) تساوي:", options: ["صفر", "٦", "غير معرفة", "-٦"], correct: 0 },
        { q: "١٢. إذا كانت د(س) = ٥ - س²، فإن د(√٣) تساوي:", options: ["٢", "٨", "٥ - √٣", "-√٣"], correct: 0 },
        { q: "١٣. إذا كانت د(س) = ٤^س (دالة أسية)، فإن د(١/٢) تساوي:", options: ["٢", "١/٢", "١٦", "٨"], correct: 0 },
        { q: "١٤. إذا كانت د(س) = |س| + ٣، فإن د(-٤) تساوي:", options: ["-١", "١", "٧", "-٧"], correct: 2 },
        { q: "١٥. إذا كانت د(س) = { ٢س + ١ عندما س > ٠ ، ٥ عندما س ≤ ٠ }، فإن د(-٣) تساوي:", options: ["-٥", "٥", "-٦", "١"], correct: 1 }
    ];

    function toEasternArabic(num) {
        const arabicDigits = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
        return num.toString().replace(/\d/g, d => arabicDigits[d]);
    }

    const listContainer = document.getElementById("questions-list");

    questions.forEach((q, qIndex) => {
        let card = document.createElement("div");
        card.className = "question-card";
        
        let title = document.createElement("div");
        title.className = "question-title";
        title.innerText = q.q;
        card.appendChild(title);

        let optionsDiv = document.createElement("div");
        optionsDiv.className, "options";
        optionsDiv.id = `opt-group-${qIndex}`;

        q.options.forEach((opt, optIndex) => {
            let btn = document.createElement("div");
            btn.className = "option-btn";
            btn.id = `btn-${qIndex}-${optIndex}`;
            btn.innerHTML = `<input type="radio" name="q${qIndex}" value="${optIndex}"> ${opt}`;
            btn.onclick = () => {
                let radios = document.getElementsByName(`q${qIndex}`);
                radios[optIndex].checked = true;
                let parent = btn.parentElement;
                Array.from(parent.children).forEach(c => c.classList.remove("selected"));
                btn.classList.add("selected");
            };
            optionsDiv.appendChild(btn);
        });

        card.appendChild(optionsDiv);
        listContainer.appendChild(card);
    });

    function calculateScore() {
        let score = 0;
        questions.forEach((q, index) => {
            let selected = document.querySelector(`input[name="q${index}"]:checked`);
            let optionsGroup = document.getElementById(`opt-group-${index}`).children;
            
            optionsGroup[q.correct].classList.add("correct-ans");

            if (selected) {
                let selectedVal = parseInt(selected.value);
                if (selectedVal === q.correct) {
                    score++;
                } else {
                    optionsGroup[selectedVal].classList.add("wrong-ans");
                }
            }
        });

        document.getElementById("sub-btn").style.display
