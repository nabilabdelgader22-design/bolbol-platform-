<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار تفاعلي: صور العناصر في الدوال | منصة بلبل التعليمية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            font-weight: 900;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            line-height: 1.7;
            text-align: right;
            padding: 20px 10px;
        }
        .quiz-container {
            max-width: 800px;
            margin: auto;
            background: #1e293b;
            padding: 25px 20px;
            border-radius: 20px;
            border: 3px solid #fbbf24;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .header {
            text-align: center;
            border-bottom: 2px dashed #ef4444;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        .header h1 {
            color: #fbbf24;
            font-size: 2rem;
            margin-bottom: 5px;
        }
        .header p {
            color: #cbd5e1;
            font-size: 1.1rem;
        }
        .question-card {
            background: #0f172a;
            border: 1px solid #334155;
            border-right: 5px solid #ef4444;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .question-title {
            color: #fbbf24;
            font-size: 1.25rem;
            margin-bottom: 15px;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option-btn {
            background: #1e293b;
            color: #ffffff;
            border: 1px solid #334155;
            padding: 12px 15px;
            border-radius: 10px;
            cursor: pointer;
            text-align: right;
            font-size: 1.1rem;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .option-btn:hover {
            border-color: #fbbf24;
            background: #334155;
        }
        .option-btn.selected {
            border-color: #fbbf24;
            background: rgba(251, 191, 36, 0.2);
        }
        .submit-btn {
            background: #ef4444;
            color: #ffffff;
            border: none;
            width: 100%;
            height: 55px;
            border-radius: 12px;
            font-size: 1.3rem;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }
        .submit-btn:hover {
            background: #dc2626;
        }
        #result-box {
            display: none;
            text-align: center;
            padding: 30px 15px;
            background: #0f172a;
            border-radius: 15px;
            border: 2px solid #fbbf24;
            margin-top: 20px;
        }
        #result-box h2 {
            color: #fbbf24;
            font-size: 2rem;
            margin-bottom: 10px;
        }
        #result-box p {
            font-size: 1.4rem;
            color: #ffffff;
        }
        .restart-btn {
            background: #fbbf24;
            color: #0f172a;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 20px;
            display: inline-block;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="header">
        <h1><i class="fas fa-square-root-variable"></i> اختبار تفاعلي: صور العناصر في الدوال</h1>
        <p>إعداد الأستاذ: Nabil Abdelgadir | منصة بلبل التعليمية</p>
    </div>

    <form id="quizForm">
        <!-- الأسئلة -->
        <div id="questions-list"></div>
        
        <button type="button" class="submit-btn" onclick="calculateScore()"><i class="fas fa-check-circle"></i> إنهاء الاختبار وإظهار النتيجة الفورية</button>
    </form>

    <div id="result-box">
        <h2><i class="fas fa-trophy"></i> نتيجة الاختبار التفاعلي</h2>
        <p id="score-text"></p>
        <button class="restart-btn" onclick="location.reload()"><i class="fas fa-redo"></i> إعادة الاختبار</button>
    </div>
</div>

<script>
    const questions = [
        { q: "1. إذا كانت د(س) = ٥س - ٣، فإن صورة العنصر ٢ بالدالة د هي:", options: ["٧", "١٣", "٣", "-٧"], correct: 0 },
        { q: "2. إذا كانت د(س) = ٧ (دالة ثابتة)، فإن قيمة د(-٥) تساوي:", options: ["-٥", "٧", "-٧", "صفر"], correct: 1 },
        { q: "3. الدالة د(س) = س² - ٤س + ٣، فإن د(٣) تساوي:", options: ["٦", "-٣", "صفر", "١"], correct: 2 },
        { q: "4. إذا كانت الدالة الجذرية د(س) = √(س + ٩)، فإن د(١٦) تساوي:", options: ["٥", "٢٥", "± ٥", "٤"], correct: 0 },
        { q: "5. الدالة الكسرية د(س) = (س + ٥) / (س - ٢)، فإن صورة العنصر ٤ هي:", options: ["٩ / ٦", "٩ / ٢", "٩", "غير معرفة"], correct: 1 },
        { q: "6. في الدالة د(س) = (٢س + ١) / (س - ٣)، تكون قيمة د(٣) هي:", options: ["٧", "صفر", "غير معرفة (غير موجودة)", "١"], correct: 2 },
        { q: "7. إذا كانت دالة المقياس د(س) = |س - ٧|، فإن د(٢) تساوي:", options: ["-٥", "٥", "٩", "-٩"], correct: 1 },
        { q: "8. إذا كانت د(س) = س³ - ٢، فإن د(-٢) تساوي:", options: ["-١٠", "-٦", "٦", "١٠"], correct: 0 },
        { q: "9. إذا كانت د(س) = ٤ لكل س ∈ R، فإن د(١٠) + د(-١٠) تساوي:", options: ["صفر", "٤", "٨", "٢٠"], correct: 2 },
        { q: "10. الدالة د(س) = √(٢٥ - س²)، فإن صورة العنصر -٣ هي:", options: ["١٦", "٤", "-٤", "± ٤"], correct: 1 },
        { q: "11. إذا كانت د(س) = (س² - ٩) / (س + ٣)، فإن د(٣) تساوي:", options: ["صفر", "٦", "غير معرفة", "-٦"], correct: 0 },
        { q: "12. إذا كانت د(س) = ٥ - س²، فإن د(√٣) تساوي:", options: ["٢", "٨", "٥ - √٣", "-√٣"], correct: 0 },
        { q: "13. إذا كانت د(س) = ٤^س (دالة أسية)، فإن د(١/٢) تساوي:", options: ["٢", "١/٢", "١٦", "٨"], correct: 0 },
        { q: "14. إذا كانت د(س) = |س| + ٣، فإن د(-٤) تساوي:", options: ["-١", "١", "٧", "-٧"], correct: 2 },
        { q: "15. إذا كانت د(س) = { ٢س + ١ عندما س > ٠ ، ٥ عندما س ≤ ٠ }، فإن د(-٣) تساوي:", options: ["-٥", "٥", "-٦", "١"], correct: 1 }
    ];

    const listContainer = document.getElementById("questions-list");

    questions.forEach((q, qIndex) => {
        let card = document.createElement("div");
        card.className = "question-card";
        
        let title = document.createElement("div");
        title.className = "question-title";
        title.innerText = q.q;
        card.appendChild(title);

        let optionsDiv = document.createElement("div");
        optionsDiv.className = "options";

        q.options.forEach((opt, optIndex) => {
            let btn = document.createElement("div");
            btn.className = "option-btn";
            btn.innerHTML = `<input type="radio" name="q${qIndex}" value="${optIndex}"> ${opt}`;
            btn.onclick = () => {
                let radios = document.getElementsByName(`q${qIndex}`);
                radios[optIndex].checked = true;
                let parent = btn.parentElement;
                Array.from(parent.children).forEach(c => c.classList.remove("selected"));
                btn.classList.add("selected");
            };
            optionsDiv.appendChild(btn);
        });

        card.appendChild(optionsDiv);
        listContainer.appendChild(card);
    });

    function calculateScore() {
        let score = 0;
        questions.forEach((q, index) => {
            let selected = document.querySelector(`input[name="q${index}"]:checked`);
            if (selected && parseInt(selected.value) === q.correct) {
                score++;
            }
        });

        document.getElementById("quizForm").style.display = "none";
        let resultBox = document.getElementById("result-box");
        resultBox.style.display = "block";
        document.getElementById("score-text").innerText = `حصلت على ${score} من أصل ${questions.length} درجات!`;
    }
</script>

</body>
</html>
