        body {
            background-color: #0b132b;
            color: #ffffff;
            line-height: 1.9;
            text-align: right;
            padding: 20px 10px;
        }
        .quiz-container {
            max-width: 850px;
            margin: auto;

            border: 3px solid #e0a96d;

        .header {

            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        .profile-img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 3px solid #e0a96d;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            object-fit: cover;
            background-color: #0b132b;
        }
        .header h1 {
            color: #e0a96d;
            font-size: 2.2rem;
            margin-bottom: 8px;
        }
        .header p {
            color: #cbd5e1;
            font-size: 1.35rem;
        }
        .question-card {
            background: #0b132b;
            border: 2px solid #3a506b;
            border-right: 6px solid #e0a96d;
            padding: 24px;
            border-radius: 15px;
            margin-bottom: 25px;
        }
        .question-title {
            color: #e0a96d;
            font-size: 1.45rem;
            margin-bottom: 18px;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .option-btn {
            background: #1c2541;
            color: #ffffff;
            border: 2px solid #3a506b;
            padding: 14px 18px;
            border-radius: 12px;
            cursor: pointer;
            text-align: right;
            font-size: 1.3rem;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .option-btn:hover {
            border-color: #e0a96d;
            background: #3a506b;
        }
        .option-btn.selected {
            border-color: #e0a96d;
            background: rgba(224, 169, 109, 0.25);
        }
        .option-btn.correct-ans {
            background-color: #14532d !important;
            border-color: #22c55e !important;
            color: #dcfce7 !important;
        }
        .option-btn.wrong-ans {
            background-color: #7f1d1d !important;
            border-color: #ef4444 !important;
            color: #fee2e2 !important;
        }
        .submit-btn {
            background: #e0a96d;
            color: #0b132b;
            border: none;
            width: 100%;
            height: 60px;
            border-radius: 14px;
            font-size: 1.5rem;
            font-weight: 900;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.3s;
        }
        .submit-btn:hover {
            background: #c89355;
        }
        #result-box {
            display: none;
            text-align: center;
            padding: 30px 20px;
            background: #0b132b;
            border-radius: 18px;
            border: 3px solid #e0a96d;
            margin-bottom: 30px;
        }
