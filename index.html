<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة بلبل التعليمية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; font-weight: 900; }
        body { background-color: #0f172a; color: #f8fafc; line-height: 1.8; text-align: center; overflow-x: hidden; font-size: 1.2rem; }
        header { background: linear-gradient(135deg, #1e293b, #0f172a); padding: 35px 15px; border-bottom: 4px solid #ef4444; }
        h1 { font-size: 2.8rem; color: #fbbf24; margin-bottom: 8px; }
        h2.subtitle { font-size: 1.5rem; color: #ffffff; }
        
        /* تنسيق السلايدر المتحرك */
        .slider-container { 
            max-width: 850px; 
            margin: 25px auto; 
            background: linear-gradient(135deg, #1e293b, #334155); 
            border-radius: 15px; 
            border: 2px solid #fbbf24; 
            padding: 30px 20px; 
            min-height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .slide { display: none; width: 100%; animation: fadeIn 0.8s ease-in-out; }
        .slide.active { display: block; }
        .slide-icon { font-size: 3rem; color: #ef4444; margin-bottom: 10px; }
        .slide-text { font-size: 1.4rem; color: #ffffff; font-weight: 900; line-height: 1.7; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        section { padding: 30px 15px; max-width: 1100px; margin: auto; }
        .section-title { color: #fbbf24; font-size: 2.3rem; margin-bottom: 22px; border-right: 6px solid #ef4444; border-left: 6px solid #ef4444; padding: 10px; background: rgba(30, 41, 59, 0.7); border-radius: 10px; }
        .card { background: #1e293b; padding: 30px; border-radius: 15px; border: 1px solid #334155; border-top: 5px solid #fbbf24; margin-top: 20px; text-align: right; }
        .card h3 { color: #fbbf24; font-size: 1.8rem; margin-bottom: 18px; }
        .card-buttons-vertical { display: flex; flex-direction: column; gap: 14px; margin-top: 22px; }
        .profile-img { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; border: 4px solid #fbbf24; margin-bottom: 20px; display: block; margin-left: auto; margin-right: auto; }
        
        .action-btn-yellow { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; padding: 16px; border-radius: 10px; text-decoration: none; font-size: 1.25rem; background-color: #fbbf24; color: #0f172a; transition: background 0.3s; }
        .action-btn-yellow:hover { background-color: #f59e0b; }
        .action-btn-red { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; padding: 16px; border-radius: 10px; text-decoration: none; font-size: 1.25rem; background-color: #ef4444; color: #ffffff; transition: background 0.3s; }
        .action-btn-red:hover { background-color: #dc2626; }
        
        .quiz-box { background: #0f172a; border: 2px solid #334155; border-radius: 15px; padding: 25px; margin-top: 20px; }
        .quiz-question { font-size: 1.35rem; color: #fbbf24; margin-bottom: 15px; }
        .quiz-option-btn { background: #1e293b; color: #fff; border: 2px solid #334155; width: 100%; padding: 14px; border-radius: 8px; font-size: 1.15rem; margin-bottom: 10px; cursor: pointer; text-align: right; }
        .correct { background-color: #22c55e !important; color: #fff !important; }
        .wrong { background-color: #ef4444 !important; color: #fff !important; }
        .quiz-result { font-size: 1.3rem; margin-top: 15px; text-align: center; }
        
        .video-box { position: relative; padding-bottom: 56.25%; height: 0; background: #000; border-radius: 10px; margin-top: 15px; }
        .video-box iframe { position: absolute; width: 100%; height: 100%; border: 0; }
        .live-buttons { display: flex; justify-content: center; gap: 15px; margin-top: 20px; flex-wrap: wrap; }
        .live-btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 15px 22px; border-radius: 10px; text-decoration: none; color: #fff; font-size: 1.2rem; flex: 1 1 160px; }
        .youtube-live { background-color: #ef4444; }
        .facebook-live { background-color: #1877f2; }
        
        .dedication-section { background: #080808; border: 2px solid #F5C542; border-radius: 20px; padding: 40px 20px; margin: 40px auto; text-align: center; box-shadow: 0 0 35px rgba(245, 197, 66, 0.25); }
        .dedication-intro { color: #f1f5f9; font-size: 1.5rem; margin-bottom: 15px; }
