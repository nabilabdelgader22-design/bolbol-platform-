<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة بلبل التعليمية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            font-weight: 900; /* خط عريض جداً لجميع عناصر الموقع */
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            line-height: 1.8;
            text-align: center;
            overflow-x: hidden;
            scroll-behavior: smooth;
            font-size: 1.2rem;
        }

        header {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            padding: 35px 15px;
            border-bottom: 4px solid #ef4444;
        }
        h1 {
            font-size: 2.8rem;
            color: #fbbf24;
            margin-bottom: 8px;
            font-weight: 900;
            text-shadow: 0 0 15px rgba(251, 191, 36, 0.4);
        }
        h2.subtitle {
            font-size: 1.5rem;
            color: #ffffff;
            font-weight: 700;
        }

        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px auto;
            padding: 0 15px;
            max-width: 800px;
            flex-wrap: wrap;
        }
        .nav-tab-btn {
            background: #1e293b;
            color: #fbbf24;
            border: 2px solid #fbbf24;
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: 900;
            text-decoration: none;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .nav-tab-btn:hover {
            background: #fbbf24;
            color: #0f172a;
            transform: translateY(-3px);
        }
        
        .slider-container {
            max-width: 850px;
            margin: 25px auto;
            position: relative;
            background: linear-gradient(135deg, #1e293b, #334155);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            border: 2px solid #fbbf24;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }
        .slide {
            display: none;
            width: 100%;
            animation: fadeIn 0.8s ease-in-out;
        }
        .slide.active {
            display: block;
        }
        .slide-icon {
            font-size: 3rem;
            color: #ef4444;
            margin-bottom: 12px;
        }
        .slide-text {
            color: #ffffff;
            font-size: 1.4rem;
            font-weight: 900;
            line-height: 1.7;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        section {
            padding: 30px 15px;
            max-width: 1100px;
            margin: auto;
            width: 100%;
        }

        .section-title {
            color: #fbbf24;
            font-size: 2.3rem;
            font-weight: 900;
            margin-bottom: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            border-right: 6px solid #ef4444;
            border-left: 6px solid #ef4444;
            padding: 10px 15px;
            background: rgba(30, 41, 59, 0.7);
            border-radius: 10px;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
            margin-top: 20px;
            width: 100%;
        }

        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 15px;
            border: 1px solid #334155;
            border-top: 5px solid #fbbf24;
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(251, 191, 36, 0.2);
        }

        .card h3 {
            color: #fbbf24;
            margin-bottom: 18px;
            font-size: 1.8rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 12px;
            line-height: 1.5;
        }

        .card p {
            color: #f1f5f9;
            font-size: 1.3rem;
            font-weight: 700;
            line-height: 1.8;
        }

        /* تنسيق الأزرار تحت بعض وبخط عريض كبير */
        .card-buttons-vertical {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 22px;
            width: 100%;
        }

        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #fbbf24;
            margin-bottom: 20px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.7);
        }

        .video-box {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 12px;
            margin-top: 20px;
            background: #000;
            border: 2px solid #334155;
        }
        .video-box iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .live-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .live-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 15px 22px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 900;
            color: #fff;
            font-size: 1.2rem;
            transition: opacity 0.3s;
            flex: 1 1 160px;
        }
        .youtube-live { background-color: #ef4444; }
        .facebook-live { background-color: #1877f2; }

        /* الأزرار باللونين الأصفر والأحمر وبخط عريض كبير جداً */
        .action-btn-yellow {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 1.25rem;
            font-weight: 900;
            background-color: #fbbf24;
            color: #0f172a;
            box-sizing: border-box;
            transition: background 0.3s;
        }
        .action-btn-yellow:hover {
            background-color: #f59e0b;
        }

        .action-btn-red {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 1.25rem;
            font-weight: 900;
            background-color: #ef4444;
            color: #ffffff;
            box-sizing: border-box;
            transition: background 0.3s;
        }
